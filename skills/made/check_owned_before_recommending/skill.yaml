  rationale: 'The 2026-10-23 record shows a blind creator-list pick: assistant msg 8c71ae56 recommended a fragrance from a reel without knowing the shelf, user msg add9536b then supplied an 11-bottle collection with a do-not-buy list covering that line, and assistant msg 651d65f2 conceded the pick was made blind. The same session later showed the corrected behavior when the shelf was known: cart check msg f949041f dropped a duplicate of an owned item. The alignment synthesis frames this as the third blind-pick correction after the Oct 20 costume and Oct 22 fit corrections, so the gap is cross-category, not one fragrance. The system shopping skill reads ~/memory/shopping/PROFILE.md, but the cologne collection lives separately at ~/workspace/user/cologne-collection.md, and a reel or creator-list recommendation can bypass a formal shopping request, so the existing skill does not cover this path. This new skill supplements rather than replaces it: check profile plus any category collection file, block exclusions except on an explicit in-conversation waiver (msg 350cddeb and revert msg 72eda642 show a waiver must be honored, not treated as permanent), and ask what the user owns when no record exists. The chunk 2 terminal failures (browser_open, browser.act, exec, bot_challenge.recover, including cursor heads runtime-child:948010b4 and runtime-child:dbab9336) carry no transcripts or error detail and show no attributable pattern, so no proposal is made for them. Managed count remains 3 active, below the 10-skill consolidation threshold, and all active managed skills remain inside their measurement windows.'
