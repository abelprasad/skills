    success_criterion: In post-install recommendation turns where a category collection or exclusion list is known, every pick shows an owned and exclusion check before the recommendation, no pick repeats a listed excluded item without an explicit in-conversation waiver, and no creator-list pick is made blind when no owned record exists without first asking what the user owns.
